name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Squash merges use the PR title as the commit message, and release-please builds
  # CHANGELOG.md from those messages — so a malformed title quietly corrupts the changelog.
  # Mirrors the house commitlint header pattern; see the commit-and-release skill.
  pr-title:
    name: PR title
    # Bots do not follow our commit convention: Renovate opens "Configure Renovate" and
    # "Update dependency x", release-please opens "chore(main): release x.y.z". Both are
    # their conventions, not ours.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.type != 'Bot' &&
      !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - name: Check conventional commit format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(improve|build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test|update)\((([A-Z]+-[0-9]+)|NO-TASK|#[0-9]+|main)\)!?: .+'
          if echo "$TITLE" | grep -Eq "$PATTERN"; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title does not match the commit convention: $TITLE"
            echo "Expected: type(LINCHPIN-1234|NO-TASK|#12): Subject in sentence case"
            echo "Types: improve build chore ci docs feat fix perf refactor revert style test update"
            echo "The scope is required — it carries the ClickUp key. See the commit-and-release skill."
            exit 1
          fi

  validate:
    name: Skill standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Enforces skills/write-a-linchpin-skill/SKILL.md: frontmatter, required sections,
      # portability, referenced files, and the README catalog.
      - name: Validate skill packages
        run: node scripts/validate-skills.mjs

      # The installer is the only executable in the package; a syntax error there breaks
      # every `npx @linchpinagency/skills` run.
      - name: Smoke-test the installer
        run: |
          node bin/install.mjs --list
          mkdir -p /tmp/install-smoke
          cd /tmp/install-smoke
          node "$GITHUB_WORKSPACE/bin/install.mjs" --skip-upstream --agent all
          test -d .claude/skills/task-tracking
          test -d .codex/skills/task-tracking
          test -d .cursor/skills/task-tracking
          test -d .agents/skills/task-tracking

      # Pruning deletes directories, so its guard rails are the ones worth pinning down: it
      # must skip partial installs entirely, and must never touch a directory it did not
      # stamp. Both are silent failures if they regress — you would only notice when an
      # install lost skills nobody asked it to remove.
      - name: Installer — dry-run, prune, and hook
        run: |
          set -euo pipefail
          W="$GITHUB_WORKSPACE"
          export HOME=/tmp/prune-home            # isolate: no global install to collide with
          mkdir -p "$HOME" /tmp/prune-test
          cd /tmp/prune-test

          node "$W/bin/install.mjs" --skip-upstream --dry-run
          test ! -e .claude   # a dry run writes nothing at all

          node "$W/bin/install.mjs" --skip-upstream --yes
          D=.claude/skills

          # A skill this package no longer ships, recorded in the stamp as ours, plus one we
          # have no record of installing.
          mkdir -p "$D/gone-away" "$D/never-ours"
          echo '# gone' > "$D/gone-away/SKILL.md"
          echo '# theirs' > "$D/never-ours/SKILL.md"
          node -e 'const f=".claude/skills/.linchpin-skills/version.json",fs=require("fs");
            const s=JSON.parse(fs.readFileSync(f)); s.skills.push("gone-away");
            fs.writeFileSync(f,JSON.stringify(s,null,2));'

          node "$W/bin/install.mjs" --skip-upstream --yes task-tracking
          test -d "$D/gone-away"    # a partial install must never prune

          node "$W/bin/install.mjs" --skip-upstream --dry-run | grep -q 'remove'
          test -d "$D/gone-away"    # ...and a dry run must only talk about it

          node "$W/bin/install.mjs" --skip-upstream --yes
          test ! -d "$D/gone-away"  # dropped from the package -> removed
          test -d "$D/never-ours"   # not ours to remove

          # The hook must merge into existing settings without clobbering them, and adding it
          # twice must not stack duplicates.
          mkdir -p .claude
          echo '{"hooks":{"SessionStart":[{"matcher":"*","hooks":[{"type":"command","command":"echo keep-me"}]}]}}' > .claude/settings.json
          node "$W/bin/install.mjs" --skip-upstream --force --yes --with-hook
          node "$W/bin/install.mjs" --skip-upstream --force --yes --with-hook
          # Count matching ENTRIES, not substring hits: one hook command legitimately names
          # update-check.mjs twice (the project path, then the $HOME fallback).
          node -e 'const s=JSON.parse(require("fs").readFileSync(".claude/settings.json"));
            const l=s.hooks.SessionStart;
            const ours=l.filter((e)=>JSON.stringify(e).includes("update-check.mjs"));
            if (l.length!==2) throw new Error("expected 2 SessionStart entries, got "+l.length);
            if (!JSON.stringify(l).includes("keep-me")) throw new Error("clobbered the pre-existing hook");
            if (ours.length!==1) throw new Error("hook was duplicated: "+ours.length+" copies");'

      # Reports into SessionStart context, so it must never throw and never block a session.
      - name: Update checker — always exits 0
        run: |
          set -euo pipefail
          node bin/update-check.mjs --help > /dev/null
          node bin/update-check.mjs --hook | grep -q SessionStart

          # CI is set in Actions and is itself an opt-out, so every assertion below states
          # what it expects of CI rather than inheriting it — otherwise these pass locally
          # and mean something different here.
          export LINCHPIN_SKILLS_REGISTRY=http://127.0.0.1:9/nope

          # Opted out because CI is set: no output, clean exit.
          CI=1 node bin/update-check.mjs | tee /tmp/ci-out
          test ! -s /tmp/ci-out
          CI=1 node bin/update-check.mjs --json | grep -q '"reason":"CI"'

          # Not CI, but the registry is unreachable: still silent, still a clean exit.
          env -u CI node bin/update-check.mjs | tee /tmp/off-out
          test ! -s /tmp/off-out
          env -u CI node bin/update-check.mjs --json | grep -q registry-unreachable

          env -u CI node bin/update-check.mjs --scan > /dev/null
